name: Create SBLT Build

on:
  push:
    paths:
      - CMakeLists.txt
      - src/**
      - lib/**
      - loader/**
      - wren/**
      - .github/workflows/**
  pull_request:
    paths:
      - CMakeLists.txt
      - src/**
      - lib/**
      - loader/**
      - wren/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0 # Fetch all the tags, so git_version.py works properly

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Configure
      run: cmake -S . -B build -A x64 -G "Visual Studio 17 2022"

    - name: Build
      run: cmake --build build --config $env:BUILD_TYPE --target SuperBLT --parallel

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Build Artifacts
        path: |
          build/RelWithDebInfo/WSOCK32.dll
          build/RelWithDebInfo/WSOCK32.pdb
